services:
  - type: web
    name: auto-dm
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: IG_ACCESS_TOKEN
        sync: false
      - key: IG_USER_ID
        sync: false
      - key: APP_SECRET
        sync: false
      - key: VERIFY_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Use a free Neon/Supabase Postgres; Render's free disk is wiped on every deploy.
      - key: DATABASE_URL
        sync: false
      - key: GRAPH_VERSION
        value: v23.0
      - key: DRY_RUN
        value: "0"
      - key: ONE_DM_PER_USER
        value: "0"
